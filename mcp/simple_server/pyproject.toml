[project]
name = "simple-server"
version = "0.1.0"
description = "Simple MCP Server"
requires-python = ">=3.9"
dependencies = [
    "fastmcp>=1.10.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.1.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]